; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:esp32-c6-devkitc-1]
; Pinned: "stable" moves, and newer releases fail to link NimBLE-Arduino 2.5.0
; (undefined r_os_mempool_init / r_os_memblock_get).
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.39/platform-espressif32.zip
board = esp32-c6-devkitc-1
framework = arduino
monitor_speed = 115200
monitor_echo = yes
build_flags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    ; This board's status LED takes R, G, B on the wire (WS2812B would be G, R, B).
    -DLED_COLOR_ORDER=LED_COLOR_ORDER_RGB
board_build.partitions = huge_app.csv
; Same versions the main firmware currently resolves to.
lib_deps =
    bblanchon/ArduinoJson@7.4.3
    h2zero/NimBLE-Arduino@2.5.0
